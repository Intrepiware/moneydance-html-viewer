<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moneydance Viewer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="light-mode">
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2><i class="fa-solid fa-wallet"></i> Finance View</h2>
          <button id="close-sidebar" class="mobile-only icon-btn">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="sidebar-content">
          <h3>Accounts</h3>
          <div id="account-tree" class="account-tree">
            <!-- Account tree rendered here -->
          </div>
        </div>
        <div class="sidebar-footer">
          <p>Read-Only Mode</p>
        </div>
      </aside>

      <!-- Main Content -->
      <main id="main-content" class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button id="open-sidebar" class="mobile-only icon-btn">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 id="current-account-name">All Accounts</h1>
          </div>
          <div
            class="topbar-right"
            style="display: flex; align-items: center; gap: 15px"
          >
            <div class="search-container">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input
                type="text"
                id="search-input"
                placeholder="Search transactions..."
              />
            </div>
            <button
              id="theme-toggle"
              class="icon-btn"
              title="Toggle Light/Dark Mode"
            >
              <i class="fa-solid fa-sun"></i>
            </button>
          </div>
        </header>

        <div class="mobile-only mobile-balance-bar">
          <span>Total Balance</span>
          <span id="mobile-total-balance" class="amount">$0.00</span>
        </div>

        <div class="content-body">
          <div class="summary-cards">
            <div class="card glass-card">
              <h4>Total Balance</h4>
              <p id="total-balance" class="amount positive">$0.00</p>
            </div>
            <div class="card glass-card">
              <h4>Transactions</h4>
              <p id="total-transactions">0</p>
            </div>
          </div>

          <div class="transactions-section glass-panel">
            <div class="table-header">
              <h2>Transactions</h2>
            </div>
            <div class="table-responsive">
              <table id="transactions-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th class="amount-col">Amount</th>
                    <th class="amount-col">Balance</th>
                  </tr>
                </thead>
                <tbody id="transactions-body">
                  <!-- Transactions rendered here -->
                </tbody>
              </table>
              <div id="no-results" class="no-results hidden">
                <i class="fa-regular fa-folder-open"></i>
                <p>No transactions found.</p>
              </div>
              
              <div id="pagination-controls" class="pagination-controls hidden">
                <button id="prev-page" class="pagination-btn"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                <span id="page-info">Page 1 of 1</span>
                <button id="next-page" class="pagination-btn">Next <i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="overlay hidden"></div>

    <!-- Handlebars Library -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>
    
    <!-- Handlebars Templates -->
    <script id="account-node-partial" type="text/x-handlebars-template">
      <div class="account-item">
        <div class="account-header" data-id="{{id}}">
          <div class="account-toggle {{#unless children.length}}empty{{/unless}} {{#if isOpen}}open{{/if}}">
            <i class="fa-solid fa-chevron-right"></i>
          </div>
          <div class="account-icon">
            <i class="fa-solid {{getAccountIcon type}}"></i>
          </div>
          <div class="account-name">{{name}}</div>
          <div class="account-balance" style="color: {{#if (isPositive (getTotalBalance this))}}var(--positive){{else}}{{#if (isNegative (getTotalBalance this))}}var(--text-main){{/if}}{{/if}}">
            {{formatCurrency (getTotalBalance this)}}
          </div>
        </div>
        {{#if children.length}}
          <div class="sub-accounts {{#if isOpen}}open{{/if}}">
            {{#each children}}
              {{> accountNode }}
            {{/each}}
          </div>
        {{/if}}
      </div>
    </script>

    <script id="account-tree-template" type="text/x-handlebars-template">
      {{> accountNode this}}
    </script>

    <script id="transactions-template" type="text/x-handlebars-template">
      {{#each paginatedTransactions}}
        {{#if showYearDivider}}
          <tr class="year-divider">
            <th colspan="5" class="sticky-year">{{year}}</th>
          </tr>
        {{/if}}
        <tr>
          <td>
            <span class="desktop-date">{{date}}</span>
            <span class="mobile-date">{{month}}/{{day}}</span>
          </td>
          <td>
            {{#if ../isRoot}}
              <div>{{description}}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">{{accountName}}</div>
            {{else}}
              {{description}}
            {{/if}}
          </td>
          <td><span style="background: var(--tag-bg); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;">{{category}}</span></td>
          <td class="amount-col amount {{#if (isPositive amount)}}positive{{else}}negative{{/if}}">{{formatCurrency amount}}</td>
          <td class="amount-col">{{formatCurrency balance}}</td>
        </tr>
      {{/each}}
    </script>

    <script src="app.js"></script>
  </body>
</html>
